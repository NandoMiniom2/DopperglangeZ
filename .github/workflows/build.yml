name: Build DoppelgangerZ

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Instalar o Gradle (versão compatível com Fabric Loom 0.6)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 6.8.3

      - name: Compilar o mod
        run: gradle build --stacktrace

      - name: Publicar o .jar como artefato para download
        uses: actions/upload-artifact@v4
        with:
          name: DoppelgangerZ-jar
          path: build/libs/*.jar
